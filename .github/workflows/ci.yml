name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The SDK's own toolchain: Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # openapi-generator-cli is a Java tool invoked through npx, so the
      # regen-drift gate needs both Node (to run npx) and a JDK (to run the
      # generator itself).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Regen-drift gate: regenerate from the committed spec (generate.sh
      # defaults to ./rest-api-openapi.json, so no spec fetch) and fail if the
      # fresh output differs from what is committed.
      - name: Regenerate SDK from committed spec
        run: ./generate.sh
      - name: Fail on regeneration drift
        run: git diff --exit-code

      # Build + test with this repo's real commands.
      - name: Install package with dev extras
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest
